# ============================================================
# SE_MANIFEST.toml (Repository Declaration)
# ============================================================

schema = "se-manifest-schema"
schema_version = "0.5.0"
schema_url = "https://raw.githubusercontent.com/structural-explainability/se-manifest-schema/main/manifest-schema.toml"

# === Framework Context ===

[meta]
framework = "Structural Explainability"
framework_url = "https://github.com/structural-explainability"
purpose = "Declares this repository's role in the Structural Explainability ecosystem."

# === Repository Identity ===

[repository]
organization = "structural-explainability"
name = "spec-se-appendix"
class = "specification"
kind = "informative"
status = "informative"
since = "2025"
summary = "Provides the Structural Explainability (SE) Appendix template."

# === Layer Position ===

[layer]
space = "structural-explainability"
role  = "specification"

# === Dependency Declarations ===

[depends]
required = [{ repository = "spec-se", kind = "semantic", version = "v1" }]
optional = []

# === Provided Artifacts ===

[provides]
artifacts = ["APPENDIX_TEMPLATE.md", "README.md", "CITATION.cff"]

# === Scope ===

[scope]
includes = ["appendix template for SE-aligned disclosures"]
excludes = [
    "new normative constraints beyond spec-se",
    "domain vocabularies",
    "epistemic evaluation",
    "causal explanations",
    "normative judgment or enforcement",
]

[citation]
cff = "CITATION.cff"
preferred = "informative"

[traceability]
identifier_map = "none"
